name = "unlimited-transfer-api"
main = "src/worker.js"
compatibility_date = "2025-11-21"

# Store the upstream key as a secret instead of committing it here:
#   wrangler secret put UNLIMITED_SURF_API_KEY
#
# Optional: protect this Worker with your own client-facing key:
#   wrangler secret put WORKER_API_KEY
# When a shared UNLIMITED_SURF_API_KEY is set, WORKER_API_KEY is required so the
# Worker cannot become a public relay. Clients send it as Authorization:
# Bearer <key>, x-api-key: <key>, or anthropic-api-key: <key>.
#
# Without a shared upstream key, clients can send their own unlimited.surf key.
# To explicitly restore the unsafe legacy public-relay behavior, set
# ALLOW_UNAUTHENTICATED = "true".

[vars]
UPSTREAM_BASE_URL = "https://unlimited.surf"
DEFAULT_MODEL = "gateway-gpt-5-5"
DEFAULT_CLAUDE_MODEL = "claude-opus-4-7-20260101"
